[project]
name = "sceneseek"
version = "1.0.0"
description = "Find any moment in your videos by describing it. Private, offline, free."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
    "pywebview>=5.0",
    "tokenizers>=0.19",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
